<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue rounded square background -->
  <rect width="256" height="256" rx="48" fill="#003e87"/>
  
  <!-- MMJ interlocking M symbol -->
  <g transform="translate(128, 128)">
    <!-- Outer left chevron -->
    <path d="M -45 -35 L -15 5 L -45 45 L -65 25 Z" fill="white"/>
    
    <!-- Outer right chevron -->
    <path d="M 45 -35 L 65 -15 L 45 45 L 25 25 Z" fill="white"/>
    
    <!-- Middle chevron (overlapping) -->
    <path d="M -20 -20 L 20 20 L -20 55 L -55 20 Z" fill="white"/>
    
    <!-- Inner chevron detail -->
    <path d="M 0 -10 L 30 20 L 0 50 L -30 20 Z" fill="white"/>
  </g>
</svg>
