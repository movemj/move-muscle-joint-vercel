<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Transparent background (implicit) -->
  <defs>
    <style>
      .favicon-bg { fill: #003e87; }
      .favicon-text { fill: white; font-family: Arial, sans-serif; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Rounded square background -->
  <rect class="favicon-bg" x="16" y="16" width="224" height="224" rx="28" ry="28"/>
  
  <!-- MMJ text -->
  <text class="favicon-text" x="128" y="160" font-size="96" text-anchor="middle" dominant-baseline="middle">MMJ</text>
</svg>
