<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded square background with deep navy -->
  <rect x="0" y="0" width="512" height="512" rx="110" ry="110" fill="#003e87"/>
  
  <!-- MMJ mark - nested chevrons in white -->
  <!-- Outer chevron -->
  <path d="M 120 200 L 256 320 L 392 200" stroke="#FFFFFF" stroke-width="45" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Middle chevron -->
  <path d="M 160 250 L 256 340 L 352 250" stroke="#FFFFFF" stroke-width="45" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Inner chevron -->
  <path d="M 200 300 L 256 360 L 312 300" stroke="#FFFFFF" stroke-width="45" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
